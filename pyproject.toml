[project]
name = "space-suite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Connor Koczian", email = "332129350+connor-koczian@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pygame>=2.6.0",
    "rich>=15.0.0",
]

[project.scripts]
space-suite = "space_suite.cli:main"
iss-tracker = "space_suite.iss.tracker:main"
launch-control = "space_suite.launch.tracker:main"
lander = "space_suite.lander.sim:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
